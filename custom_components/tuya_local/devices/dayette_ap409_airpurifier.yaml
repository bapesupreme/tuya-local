name: Air Purifier AP409
products:
  - id: rufdceynizoy3e2p
    manufacturer: Dayette
    model: AP409
entities:
  - entity: fan
    dps:
      - id: 1
        type: boolean
        name: switch
  - entity: select
    name: Mode
    category: config
    dps:
      - id: 3
        type: string
        name: option
        mapping:
          - dps_val: auto
            value: Auto
          - dps_val: sleep
            value: Sleep
          - dps_val: manual
            value: Manual
  - entity: select
    name: Fan Speed
    category: config
    dps:
      - id: 4
        type: string
        name: option
        mapping:
          - dps_val: Low
            value: Low
          - dps_val: Medium
            value: Medium
          - dps_val: High
            value: High
          - dps_val: Pet
            value: Pet
  - entity: sensor
    class: pm25
    dps:
      - id: 2
        type: integer
        name: sensor
        class: measurement
        unit: ugm3
  - entity: sensor
    translation_key: filter_life
    category: diagnostic
    dps:
      - id: 5
        type: integer
        name: sensor
        unit: "%"
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 18
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: 2h
            value: 2h
          - dps_val: 4h
            value: 4h
          - dps_val: 6h
            value: 6h
          - dps_val: 8h
            value: 8h
  - entity: sensor
    translation_key: time_remaining
    category: diagnostic
    dps:
      - id: 19
        type: integer
        name: sensor
        unit: min
  - entity: switch
    name: Child Lock
    category: config
    dps:
      - id: 7
        type: boolean
        name: switch
  - entity: button
    translation_key: filter_reset
    category: config
    dps:
      - id: 11
        type: boolean
        name: button
