name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 6am UTC
  workflow_dispatch:      # allows manual trigger from Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Backup my file
        run: cp dayette_ap409_airpurifier.yaml /tmp/dayette_ap409_airpurifier.yaml

      - name: Add upstream remote
        run: git remote add upstream https://github.com/ORIGINAL_OWNER/ORIGINAL_REPO.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream/main
        run: git merge upstream/main --no-edit -X ours

      - name: Restore my file
        run: cp /tmp/dayette_ap409_airpurifier.yaml dayette_ap409_airpurifier.yaml

      - name: Commit if changed
        run: |
          git add dayette_ap409_airpurifier.yaml
          git diff --cached --quiet || git commit -m "Restore my version of dayette_ap409_airpurifier.yaml"

      - name: Push
        run: git push origin main
